name: Generate Snake Animation (Spider-Verse Theme)

on:
  schedule:
    - cron: "0 */6 * * *"   # atualiza a cada 6 horas
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation (Spider-Verse palette)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: J3ffreyJr
          outputs: |
            dist/github-contribution-grid-snake-spidey-dark.svg?color_snake=%23E62429&color_dots=%230d0d0f,%233c1361,%238b2fc9,%23e62429,%2300e5ff
            dist/github-contribution-grid-snake-spidey.svg?color_snake=%23E62429&color_dots=%23f4f4f6,%23c9b3f5,%238b2fc9,%23e62429,%2300b8d4

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
