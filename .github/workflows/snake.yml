name: Generate Snake Animation (Iron Spider / SUIT_OS Theme)

on:
  schedule:
    - cron: "0 */6 * * *"   # atualiza a cada 6 horas
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation (SUIT_OS palette)
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: J3ffreyJr
          outputs: |
            dist/github-contribution-grid-snake-suitos-dark.svg?color_snake=%2300E5FF&color_dots=%2305060a,%233c0810,%23d81e2c,%23ff2d78,%2300e5ff
            dist/github-contribution-grid-snake-suitos.svg?color_snake=%2300B8D4&color_dots=%23f4f4f6,%23f5b3c9,%23d81e2c,%23ff2d78,%2300b8d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
